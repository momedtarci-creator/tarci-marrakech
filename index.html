 <!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARCI | Construction, Villas, Rénovation & Ménage</title>

<meta name="description"
content="TARCI accompagne vos projets de construction, villas, rénovation, finitions et ménage avec une approche professionnelle et soignée.">

<meta name="keywords"
content="TARCI, construction, villa, rénovation, bâtiment, finition, ménage, Maroc">

<meta name="theme-color" content="#111111">

<style>
:root{
  --dark:#111;
  --dark2:#191919;
  --cream:#f5f3ef;
  --white:#fff;
  --gold:#c5a46d;
  --text:#252525;
  --muted:#777;
  --line:#e5e2dc;
  --radius:18px;
  --shadow:0 18px 55px rgba(0,0,0,.10);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
}

img{
  width:100%;
  display:block;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  background:rgba(17,17,17,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  color:#fff;
  font-size:29px;
  font-weight:800;
  letter-spacing:2px;
}

.logo span{
  color:var(--gold);
}

.menu{
  display:flex;
  align-items:center;
  gap:28px;
}

.menu a{
  color:#ddd;
  font-size:14px;
  transition:.25s;
}

.menu a:hover{
  color:#fff;
}

.langs{
  display:flex;
  align-items:center;
  gap:5px;
  margin-left:5px;
}

.lang{
  border:1px solid rgba(255,255,255,.16);
  background:transparent;
  color:#ddd;
  padding:6px 8px;
  border-radius:7px;
  cursor:pointer;
  font-size:11px;
}

.lang.active,
.lang:hover{
  background:#fff;
  color:#111;
}

.header-btn{
  background:var(--gold);
  color:#111;
  padding:11px 17px;
  border-radius:8px;
  font-weight:700;
  font-size:13px;
}

.mobile-btn{
  display:none;
  color:#fff;
  font-size:27px;
  cursor:pointer;
}

/* ================= HERO ================= */

.hero{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  color:#fff;
  background:
    linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.40),rgba(0,0,0,.18)),
    url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2000&q=90")
    center/cover no-repeat;
}

.hero-content{
  padding-top:70px;
  max-width:730px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:#ddd;
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:11px;
  margin-bottom:22px;
}

.eyebrow::before{
  content:"";
  width:34px;
  height:1px;
  background:var(--gold);
}

.hero h1{
  font-size:clamp(42px,7vw,82px);
  line-height:1.02;
  letter-spacing:-2px;
  margin-bottom:24px;
  font-weight:700;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  max-width:650px;
  color:#ddd;
  font-size:18px;
  line-height:1.8;
  margin-bottom:34px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:50px;
  padding:0 23px;
  border-radius:8px;
  font-weight:700;
  font-size:14px;
  transition:.25s;
}

.btn-primary{
  background:#fff;
  color:#111;
}

.btn-primary:hover{
  transform:translateY(-2px);
}

.btn-outline{
  border:1px solid rgba(255,255,255,.45);
  color:#fff;
}

.btn-outline:hover{
  background:#fff;
  color:#111;
}

.hero-bottom{
  position:absolute;
  bottom:28px;
  left:0;
  right:0;
}

.hero-note{
  color:rgba(255,255,255,.72);
  font-size:12px;
  letter-spacing:.5px;
}

/* ================= SECTIONS ================= */

section{
  padding:105px 0;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:30px;
  margin-bottom:48px;
}

.kicker{
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:11px;
  font-weight:700;
  margin-bottom:12px;
}

.section-title{
  font-size:clamp(32px,5vw,52px);
  line-height:1.08;
  letter-spacing:-1px;
  color:#171717;
}

.section-text{
  max-width:520px;
  color:var(--muted);
  line-height:1.8;
}

/* ================= SERVICES ================= */

.services{
  background:var(--cream);
}

.service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.service{
  background:#fff;
  padding:32px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  min-height:245px;
  transition:.3s;
}

.service:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
}

.service-number{
  color:#aaa;
  font-size:12px;
  margin-bottom:35px;
}

.service h3{
  font-size:22px;
  margin-bottom:12px;
}

.service p{
  color:var(--muted);
  font-size:14px;
  line-height:1.75;
}

/* ================= ABOUT ================= */

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
}

.about-image{
  position:relative;
}

.about-image img{
  height:610px;
  object-fit:cover;
  border-radius:20px;
}

.image-label{
  position:absolute;
  bottom:22px;
  left:22px;
  background:rgba(17,17,17,.90);
  color:#fff;
  padding:15px 18px;
  border-radius:10px;
  font-size:13px;
}

.about-copy p{
  color:var(--muted);
  margin:20px 0;
  line-height:1.9;
}

.about-list{
  margin-top:28px;
  display:grid;
  gap:12px;
}

.about-list div{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:600;
}

.about-list span{
  width:8px;
  height:8px;
  background:var(--gold);
  border-radius:50%;
}

/* ================= PROCESS ================= */

.process{
  background:#111;
  color:#fff;
}

.process .section-title{
  color:#fff;
}

.process .section-text{
  color:#aaa;
}

.process-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid #333;
}

.step{
  padding:35px 25px 10px;
  border-right:1px solid #333;
}

.step:last-child{
  border-right:0;
}

.step small{
  color:var(--gold);
  font-weight:700;
  letter-spacing:2px;
}

.step h3{
  margin:20px 0 12px;
  font-size:20px;
}

.step p{
  color:#aaa;
  font-size:14px;
  line-height:1.75;
}

/* ================= PROJECTS ================= */

.projects{
  background:#fff;
}

.project-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:16px;
}

.project{
  position:relative;
  overflow:hidden;
  border-radius:16px;
  min-height:340px;
  background:#ddd;
}

.project:nth-child(1),
.project:nth-child(4){
  grid-column:span 7;
}

.project:nth-child(2),
.project:nth-child(3),
.project:nth-child(5),
.project:nth-child(6){
  grid-column:span 5;
}

.project img{
  height:100%;
  min-height:340px;
  object-fit:cover;
  transition:transform .7s;
}

.project:hover img{
  transform:scale(1.045);
}

.project-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:end;
  padding:27px;
  background:linear-gradient(transparent 35%,rgba(0,0,0,.78));
  color:#fff;
}

.project-overlay small{
  color:#ddd;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
}

.project-overlay h3{
  font-size:25px;
  margin-top:6px;
}

/* ================= TEAM / EXPERTISE ================= */

.expertise{
  background:var(--cream);
}

.expertise-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.expert-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line);
}

.expert-card img{
  height:420px;
  object-fit:cover;
}

.expert-info{
  padding:25px;
}

.expert-info h3{
  margin-bottom:7px;
  font-size:22px;
}

.expert-info p{
  color:var(--muted);
  font-size:14px;
}

/* ================= WHY ================= */

.why-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.why-item{
  padding:32px;
  border:1px solid var(--line);
  border-radius:15px;
}

.why-item h3{
  margin-bottom:10px;
  font-size:20px;
}

.why-item p{
  color:var(--muted);
  font-size:14px;
  line-height:1.75;
}

/* ================= FAQ ================= */

.faq{
  background:var(--cream);
}

.faq-list{
  max-width:900px;
  margin:auto;
}

.faq-item{
  background:#fff;
  border-bottom:1px solid var(--line);
}

.faq-question{
  width:100%;
  background:none;
  border:0;
  padding:24px 5px;
  display:flex;
  justify-content:space-between;
  text-align:left;
  cursor:pointer;
  font-weight:700;
  font-size:16px;
  color:#222;
}

.faq-answer{
  display:none;
  padding:0 5px 24px;
  color:var(--muted);
  line-height:1.8;
  font-size:14px;
}

.faq-item.open .faq-answer{
  display:block;
}

.faq-item.open .faq-question span{
  transform:rotate(45deg);
}

.faq-question span{
  font-size:25px;
  font-weight:300;
  transition:.2s;
}

/* ================= CTA ================= */

.cta{
  padding:90px 0;
  background:#171717;
  color:#fff;
}

.cta-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:35px;
}

.cta h2{
  font-size:clamp(32px,5vw,58px);
  line-height:1.1;
  margin-bottom:14px;
}

.cta p{
  color:#aaa;
  max-width:650px;
}

/* ================= CONTACT ================= */

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
}

.contact-info h2{
  font-size:45px;
  line-height:1.1;
  margin-bottom:20px;
}

.contact-info>p{
  color:var(--muted);
  line-height:1.8;
  max-width:550px;
}

.contact-links{
  margin-top:35px;
  display:grid;
  gap:13px;
}

.contact-link{
  padding:18px 20px;
  border:1px solid var(--line);
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:.25s;
}

.contact-link:hover{
  border-color:var(--gold);
  transform:translateX(3px);
}

.contact-link small{
  color:var(--muted);
  display:block;
}

.contact-link strong{
  font-size:17px;
}

.contact-form{
  background:var(--cream);
  padding:35px;
  border-radius:18px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.input,
textarea{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:14px;
  margin-bottom:12px;
  outline:none;
  font:inherit;
}

textarea{
  min-height:135px;
  resize:vertical;
}

.form-button{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:15px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

/* ================= FOOTER ================= */

footer{
  background:#111;
  color:#aaa;
  padding:35px 0;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.footer-logo{
  color:#fff;
  font-size:22px;
  font-weight:800;
  letter-spacing:2px;
}

.footer-logo span{
  color:var(--gold);
}

.footer-copy{
  font-size:12px;
}

/* ================= WHATSAPP ================= */

.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  width:57px;
  height:57px;
  background:#25D366;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  z-index:999;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

/* ================= RTL ================= */

html[dir="rtl"] body{
  font-family:Arial,Tahoma,sans-serif;
}

html[dir="rtl"] .menu{
  direction:rtl;
}

html[dir="rtl"] .hero{
  background:
    linear-gradient(270deg,rgba(0,0,0,.78),rgba(0,0,0,.40),rgba(0,0,0,.18)),
    url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2000&q=90")
    center/cover no-repeat;
}

html[dir="rtl"] .faq-question{
  text-align:right;
}

html[dir="rtl"] .contact-link:hover{
  transform:translateX(-3px);
}

/* ================= MOBILE ================= */

@media(max-width:950px){

  .menu{
    display:none;
    position:absolute;
    top:76px;
    left:0;
    right:0;
    background:#111;
    padding:22px 5%;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    border-top:1px solid #292929;
  }

  .menu.open{
    display:flex;
  }

  .menu a{
    padding:13px 0;
    border-bottom:1px solid #292929;
  }

  .langs{
    padding:16px 0;
    margin:0;
  }

  .header-btn{
    text-align:center;
    margin-top:5px;
  }

  .mobile-btn{
    display:block;
  }

  .service-grid{
    grid-template-columns:1fr 1fr;
  }

  .process-grid{
    grid-template-columns:1fr 1fr;
  }

  .step{
    border-bottom:1px solid #333;
  }

  .project:nth-child(n){
    grid-column:span 6;
  }

  .about-grid,
  .contact-grid{
    grid-template-columns:1fr;
    gap:40px;
  }

  .about-image img{
    height:500px;
  }

  .cta-box{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(max-width:650px){

  section{
    padding:75px 0;
  }

  .container{
    width:90%;
  }

  .nav{
    height:68px;
  }

  .menu{
    top:68px;
  }

  .hero{
    min-height:760px;
  }

  .hero-content{
    padding-top:55px;
  }

  .hero h1{
    font-size:46px;
    letter-spacing:-1.5px;
  }

  .hero p{
    font-size:15px;
    line-height:1.7;
  }

  .section-head{
    display:block;
    margin-bottom:32px;
  }

  .section-text{
    margin-top:20px;
  }

  .service-grid,
  .expertise-grid,
  .why-grid{
    grid-template-columns:1fr;
  }

  .service{
    min-height:auto;
  }

  .process-grid{
    grid-template-columns:1fr;
  }

  .step{
    border-right:0;
  }

  .project-grid{
    display:grid;
    grid-template-columns:1fr;
  }

  .project:nth-child(n){
    grid-column:span 1;
    min-height:320px;
  }

  .project img{
    min-height:320px;
  }

  .expert-card img{
    height:360px;
  }

  .contact-info h2{
    font-size:38px;
  }

  .form-row{
    grid-template-columns:1
