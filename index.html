 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARCI | Construction, bâtiment et rénovation à Marrakech</title>

<meta name="description"
content="TARCI - Construction, bâtiment, rénovation, villas et projets professionnels à Marrakech et au Maroc.">

<meta name="robots" content="index, follow">

<link rel="canonical"
href="https://momedtarci-creator.github.io/tarci-marrakech/">

<style>

:root{
  --navy:#0b1b32;
  --navy2:#122744;
  --gold:#d6a94c;
  --gold-light:#f0cf7a;
  --white:#ffffff;
  --light:#f5f7fa;
  --text:#172033;
  --muted:#687386;
  --shadow:0 12px 35px rgba(11,27,50,.12);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.6;
}

img{
  max-width:100%;
  display:block;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(11,27,50,.97);
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.navbar{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  color:#fff;
  font-weight:800;
  font-size:23px;
  letter-spacing:1px;
}

.brand img{
  width:52px;
  height:52px;
  object-fit:contain;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:26px;
}

.nav-links a{
  color:#fff;
  font-size:14px;
  font-weight:600;
  transition:.25s;
}

.nav-links a:hover{
  color:var(--gold-light);
}

.lang{
  border:1px solid rgba(255,255,255,.35);
  padding:7px 10px;
  border-radius:7px;
  background:transparent;
  color:#fff;
  cursor:pointer;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}

/* ================= HERO ================= */

.hero{
  min-height:720px;
  position:relative;
  display:flex;
  align-items:center;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      rgba(5,18,35,.94) 0%,
      rgba(5,18,35,.76) 45%,
      rgba(5,18,35,.30) 100%
    ),
    url("tarci-hero-bg.png")
    center/cover no-repeat;
}

.hero-content{
  position:relative;
  z-index:2;
  color:#fff;
  max-width:720px;
  padding:80px 0;
}

.hero-logo{
  width:105px;
  height:105px;
  object-fit:contain;
  margin-bottom:22px;
}

.hero h1{
  font-size:72px;
  line-height:1;
  letter-spacing:3px;
  margin-bottom:16px;
}

.hero-subtitle{
  font-size:22px;
  font-weight:600;
  color:var(--gold-light);
  margin-bottom:18px;
}

.hero-text{
  font-size:19px;
  max-width:650px;
  color:rgba(255,255,255,.9);
  margin-bottom:32px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:13px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:50px;
  padding:0 22px;
  border-radius:8px;
  font-weight:700;
  transition:.25s;
}

.btn-primary{
  background:#e7bd62;
  color:var(--navy);
}

.btn-primary:hover{
  background:#f0cf7a;
  transform:translateY(-2px);
}

.btn-outline{
  border:1px solid rgba(255,255,255,.6);
  color:#fff;
  background:rgba(255,255,255,.06);
}

.btn-outline:hover{
  background:#fff;
  color:var(--navy);
}

/* ================= SECTIONS ================= */

section{
  padding:90px 0;
}

.section-title{
  text-align:center;
  margin-bottom:50px;
}

.section-title span{
  display:block;
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

.section-title h2{
  font-size:40px;
  color:var(--navy);
  margin-bottom:12px;
}

.section-title p{
  color:var(--muted);
  max-width:650px;
  margin:auto;
}

/* ================= INTRO ================= */

.intro{
  background:#fff;
}

.intro-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.info-card{
  padding:32px;
  border-radius:14px;
  background:#fff;
  box-shadow:var(--shadow);
  border:1px solid #edf0f4;
  text-align:center;
}

.info-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#f8efd9;
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 18px;
  font-size:25px;
}

.info-card h3{
  color:var(--navy);
  margin-bottom:10px;
}

.info-card p{
  color:var(--muted);
}

/* ================= SERVICES ================= */

.services{
  background:var(--light);
}

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.service-card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.3s;
}

.service-card:hover{
  transform:translateY(-6px);
}

.service-card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.service-content{
  padding:24px;
}

.service-content h3{
  color:var(--navy);
  margin-bottom:8px;
}

.service-content p{
  color:var(--muted);
  font-size:15px;
}

/* ================= ABOUT ================= */

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:center;
}

.about-image{
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.about-image img{
  width:100%;
  min-height:430px;
  object-fit:cover;
}

.about-content span{
  color:var(--gold);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:13px;
}

.about-content h2{
  color:var(--navy);
  font-size:40px;
  line-height:1.15;
  margin:12px 0 18px;
}

.about-content p{
  color:var(--muted);
  margin-bottom:20px;
}

.about-list{
  list-style:none;
}

.about-list li{
  margin:12px 0;
  font-weight:600;
  color:var(--navy);
}

.about-list li::before{
  content:"✓";
  color:var(--gold);
  margin-right:10px;
  font-weight:900;
}

/* ================= PROJECTS ================= */

.projects{
