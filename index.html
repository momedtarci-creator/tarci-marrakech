<html lang="fr" dir="ltr">

<head>
  <meta charset="UTF-8">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #20252b;
      background: #f5f6f7;
      line-height: 1.7;
    }

    a {
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background:
        radial-gradient(circle at top right, rgba(221,166,55,.18), transparent 35%),
        linear-gradient(135deg, #0b151f, #172b3d 60%, #0c1925);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
      padding: 18px 22px 90px;
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      min-height: 65px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      padding-bottom: 16px;
    }

    .brand {
      color: white;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .nav-links a {
      color: #e8edf2;
      font-size: 14px;
      font-weight: bold;
      transition: .25s;
    }

    .nav-links a:hover {
      color: #e0b84f;
    }

    /* =========================
       LANGUAGE
    ========================= */

    .languages {
      display: flex;
      gap: 5px;
      background: rgba(255,255,255,.08);
      padding: 5px;
      border-radius: 10px;
    }

    .lang-btn {
      border: 0;
      background: transparent;
      color: #dce3e9;
      padding: 7px 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .lang-btn.active,
    .lang-btn:hover {
      background: #e0b84f;
      color: #111820;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 920px;
      margin: 0 auto;
      text-align: center;
      padding-top: 75px;
    }

    .logo {
      width: 145px;
      background: white;
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 20px 55px rgba(0,0,0,.28);
      margin-bottom: 28px;
    }

    .hero h1 {
      font-size: 72px;
      letter-spacing: 10px;
      line-height: 1;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 27px;
      font-weight: 700;
      color: #f4f6f8;
      margin-bottom: 18px;
    }

    .hero-text {
      max-width: 760px;
      margin: auto;
      color: #cdd6df;
      font-size: 17px;
      line-height: 1.9;
    }

    /* =========================
       HERO BUTTONS
    ========================= */

    .hero-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 30px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 175px;
      padding: 14px 23px;
      border-radius: 10px;
      font-weight: bold;
      transition: .25s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-gold {
      background: #e0b84f;
      color: #101820;
    }

    .btn-whatsapp {
      background: #1fa463;
      color: white;
    }

    .btn-outline {
      border: 1px solid rgba(255,255,255,.45);
      color: white;
    }

    .btn-outline:hover {
      background: white;
      color: #101820;
    }

    /* =========================
       PHONE BAR
    ========================= */

    .phone-bar {
      margin-top: 45px;
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .phone-bar a {
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .phone-bar a:hover {
      color: #e0b84f;
    }

    /* =========================
       SECTIONS
    ========================= */

    section {
      padding: 85px 20px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 48px;
    }

    .section-heading span {
      display: block;
      color: #b18727;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      font-size: 38px;
      color: #142638;
      margin-bottom: 10px;
    }

    .section-heading p {
      color: #69727b;
    }

    /* =========================
       SERVICES
    ========================= */

    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .service {
      background: white;
      border-radius: 18px;
      padding: 35px 28px;
      box-shadow: 0 10px 35px rgba(20,38,56,.08);
      border: 1px solid #edf0f2;
      transition: .3s;
      text-align: center;
    }

    .service:hover {
      transform: translateY(-7px);
      box-shadow: 0 18px 40px rgba(20,38,56,.13);
    }

    .service-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7edcf;
      color: #a77b19;
      font-size: 27px;
    }

    .service h3 {
      color: #142638;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .service p {
      color: #626a72;
      font-size: 15px;
    }

    /* =========================
       ABOUT
    ========================= */

    .about {
      background: white;
    }

    .about-box {
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    .about-box p {
      color: #555f68;
      font-size: 18px;
      line-height: 2;
    }

    /* =========================
       WHY TARCI
    ========================= */

    .advantages {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .advantage {
      padding: 28px;
      background: #fff;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #edf0f2;
    }

    .advantage strong {
      display: block;
      color: #142638;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .advantage p {
      color: #69727b;
      font-size: 14px;
    }

    /* =========================
       CONTACT
    ========================= */

    .contact {
      background:
        radial-gradient(circle at center, rgba(224,184,79,.12), transparent 45%),
        #132536;
      color: white;
      text-align: center;
    }

    .contact .section-heading h2 {
      color: white;
    }

    .contact .section-heading p {
      color: #c9d2da;
    }

    .contact-info {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 25px;
    }

    .contact-card {
      min-width: 230px;
      padding: 22px;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
    }

    .contact-card small {
      display: block;
      color: #aebbc6;
      margin-bottom: 5px;
    }

    .contact-card a {
      color: #e0b84f;
      font-size: 19px;
      font-weight: bold;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #09131d;
      color: #aeb7bf;
      text-align: center;
      padding: 28px 15px;
      font-size: 13px;
    }

    footer strong {
      color: white;
    }

    /* =========================
       FLOATING WHATSAPP
    ========================= */

    .floating-whatsapp {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #1fa463;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
      z-index: 1000;
    }

    /* =========================
       ARABIC
    ========================= */

    html[dir="rtl"] .nav-links {
      direction: rtl;
    }

    html[dir="rtl"] body {
      font-family: Arial, Tahoma, sans-serif;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 850px) {

      .navbar {
        flex-direction: column;
        align-items: center;
      }

      .nav-right {
        flex-direction: column;
        gap: 14px;
      }

      .services,
      .advantages {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 55px;
      }

      .hero h1 {
        font-size: 58px;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header-inner {
        padding: 14px 15px 65px;
      }

      .navbar {
        gap: 14px;
      }

      .brand {
        font-size: 25px;
      }

      .nav-links {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-links a {
        font-size: 13px;
      }

      .languages {
        margin-top: 3px;
      }

      .hero {
        padding-top: 45px;
      }

      .logo {
        width: 125px;
        margin-bottom: 24px;
      }

      .hero h1 {
        font-size: 49px;
        letter-spacing: 7px;
      }

      .hero-title {
        font-size: 21px;
        line-height: 1.5;
      }

      .hero-text {
        font-size: 15px;
        line-height: 1.85;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: 100%;
        max-width: 320px;
      }

      .phone-bar {
        flex-direction: column;
        gap: 7px;
      }

      section {
        padding: 65px 16px;
      }

      .section-heading {
        margin-bottom: 35px;
      }

      .section-heading h2 {
        font-size: 30px;
      }

      .service {
        padding: 30px 22px;
      }

      .about-box p {
        font-size: 16px;
        line-height: 1.9;
      }

      .contact-info {
        flex-direction: column;
        align-items: center;
      }

      .contact-card {
        width: 100%;
        max-width: 340px;
      }

      .floating-whatsapp {
        width: 54px;
        height: 54px;
        right: 14px;
        bottom: 14px;
      }
    }

  </style>
</head>


<body>

       HEADER

  <header>

    <div class="header-inner">

      <nav class="navbar">

            <a href="#services" data-i18n="navServices">Services</a>
            <a href="#about" data-i18n="navAbout">À propos</a>
            <a href="#contact" data-i18n="navContact">Contact</a>
          </div>

          <div class="languages">

            <button class="lang-btn active" data-lang="fr">FR</button>
            <button class="lang-btn" data-lang="ar">AR</button>
