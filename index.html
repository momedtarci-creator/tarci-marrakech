<style>
:root{
  --navy:#08233f;
  --navy2:#0d3155;
  --gold:#d7a72c;
  --white:#fff;
  --light:#f5f7fa;
  --text:#1d2935;
  --muted:#687585;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  max-width:100%;
  display:block;
}

.container{
  width:min(1150px,92%);
  margin:auto;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,35,63,.97);
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.navbar{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo img{
  width:150px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
  color:#fff;
  font-size:15px;
}

.nav-links a{
  transition:.2s;
}

.nav-links a:hover{
  color:var(--gold);
}

.languages{
  display:flex;
  gap:6px;
}

.lang-btn{
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  color:#fff;
  padding:6px 9px;
  border-radius:5px;
  cursor:pointer;
  font-size:12px;
}

.lang-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#111;
}

.menu-btn{
  display:none;
  color:#fff;
  font-size:27px;
  cursor:pointer;
}

/* HERO */
.hero{
  min-height:650px;
  display:flex;
  align-items:center;
  background:
    linear-gradient(rgba(8,35,63,.65),rgba(8,35,63,.68)),
    url("tarci-hero-bg.png") center/cover no-repeat;
}

.hero-content{
  max-width:760px;
  color:#fff;
}

.hero h1{
  font-size:clamp(40px,6vw,70px);
  line-height:1.05;
  margin-bottom:18px;
  font-weight:800;
}

.hero h1 span{
  color:var(--gold);
}

.hero-subtitle{
  font-size:22px;
  margin-bottom:15px;
  font-weight:600;
}

.hero p{
  font-size:18px;
  max-width:700px;
  color:#eef3f8;
  margin-bottom:28px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:13px 22px;
  border-radius:6px;
  font-weight:700;
  transition:.2s;
}

.btn-primary{
  background:var(--gold);
  color:#111;
}

.btn-primary:hover{
  transform:translateY(-2px);
}

.btn-outline{
  border:1px solid #fff;
  color:#fff;
}

.btn-outline:hover{
  background:#fff;
  color:var(--navy);
}

/* SECTIONS */
section{
  padding:80px 0;
}

.section-label{
  color:var(--gold);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:14px;
  margin-bottom:8px;
}

.section-title{
  color:var(--navy);
  font-size:38px;
  line-height:1.2;
  margin-bottom:15px;
}

.section-intro{
  color:var(--muted);
  max-width:720px;
  margin-bottom:35px;
}

/* INTRO */
.intro{
  background:#fff;
}

.intro-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.intro-card{
  padding:28px;
  border-radius:10px;
  background:var(--light);
  box-shadow:var(--shadow);
}

.intro-card h3{
  color:var(--navy);
  margin
