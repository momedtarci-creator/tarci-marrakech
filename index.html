  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
      color: #20242a;
      background: #f4f6f8;
    }

    header {
      background: linear-gradient(135deg, #0c192a, #192b41);
      color: white;
      text-align: center;
      padding: 25px 20px 70px;
    }

    .topbar {
      max-width: 1150px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      padding-bottom: 40px;
    }

    .brand {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .phones {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .phone {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .phone:hover {
      color: #f2c94c;
    }

    .logo {
      width: 165px;
      max-width: 70%;
      background: white;
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 22px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
    }

    h1 {
      font-size: 58px;
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .hero-text {
      max-width: 750px;
      margin: 20px auto 0;
      color: #e4e8ed;
      font-size: 17px;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: .3s;
    }

    .btn-main {
      background: #f2c94c;
      color: #17202b;
    }

    .btn-main:hover {
      transform: translateY(-3px);
    }

    .btn-dark {
      border: 1px solid rgba(255,255,255,.5);
      color: white;
    }

    .btn-dark:hover {
      background: white;
      color: #172b42;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 0 20px;
    }

    section {
      padding: 70px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 34px;
      color: #172b42;
      margin-bottom: 8px;
    }

    .section-title p {
      color: #666;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }

    .card h3 {
      color: #172b42;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .card p {
      color: #555;
    }

    .about {
      background: white;
    }

    .about-text {
      max-width: 850px;
      margin: auto;
      text-align: center;
      font-size: 18px;
      color: #555;
    }

    .contact {
      background: #172b42;
      color: white;
      text-align: center;
    }

    .contact h2 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .contact p {
      margin-bottom: 10px;
    }

    .contact a {
      color: #f2c94c;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      background: #0c192a;
      color: #ddd;
      text-align: center;
      padding: 25px 15px;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 19px;
      }

      .services {
        grid-template-columns: 1fr;
      }

      .topbar {
        justify-content: center;
      }
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 34px;
        letter-spacing: 3px;
      }

      .logo {
        width: 140px;
      }
    }
