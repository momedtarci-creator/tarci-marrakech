 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARCI Marrakech | Construction, bâtiment et rénovation</title>

<meta name="description"
content="TARCI Marrakech - Construction, bâtiment, rénovation, villas et projets professionnels à Marrakech et au Maroc.">

<meta name="keywords"
content="TARCI, TARCI Marrakech, construction Marrakech, bâtiment Marrakech, rénovation Marrakech, villas Marrakech">

<meta name="author" content="TARCI Marrakech">

<link rel="canonical"
href="https://momedtarci-creator.github.io/tarci-marrakech/">

<style>

:root{
  --navy:#071a33;
  --navy2:#0d294b;
  --gold:#d6ad55;
  --white:#ffffff;
  --light:#f5f7fa;
  --text:#182433;
  --muted:#657384;
  --border:#e3e8ee;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.6;
}

img{
  max-width:100%;
  display:block;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* ================= HEADER ================= */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  background:rgba(7,26,51,.96);
  backdrop-filter:blur(10px);
  box-shadow:0 2px 15px rgba(0,0,0,.15);
}

.navbar{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo img{
  width:130px;
  height:auto;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:28px;
  list-style:none;
}

.nav-links a{
  color:#fff;
  font-size:15px;
  font-weight:600;
  transition:.25s;
}

.nav-links a:hover{
  color:var(--gold);
}

.language{
  display:flex;
  gap:5px;
}

.language button{
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  color:#fff;
  border-radius:5px;
  padding:5px 8px;
  cursor:pointer;
  font-size:12px;
}

.language button:hover{
  background:var(--gold);
  color:var(--navy);
}

.menu-btn{
  display:none;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}

/* ================= HERO ================= */

.hero{
  min-height:720px;
  padding-top:72px;
  display:flex;
  align-items:center;
  position:relative;
  background:
    linear-gradient(rgba(4,19,37,.68),rgba(4,19,37,.68)),
    url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1800&q=85")
    center/cover no-repeat;
}

.hero-content{
  max-width:760px;
  color:#fff;
}

.hero h1{
  font-size:58px;
  line-height:1.08;
  margin-bottom:22px;
  font-weight:800;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  font-size:20px;
  max-width:700px;
  margin-bottom:32px;
  color:#eef3f8;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:50px;
  padding:0 24px;
  border-radius:7px;
  font-weight:700;
  transition:.25s;
}

.btn-primary{
  background:var(--gold);
  color:var(--navy);
}

.btn-primary:hover{
  transform:translateY(-2px);
  background:#e5bf6d;
}

.btn-outline{
  border:1px solid #fff;
  color:#fff;
}

.btn-outline:hover{
  background:#fff;
  color:var(--navy);
}

/* ================= SECTIONS ================= */

section{
  padding:85px 0;
}

.section-title{
  text-align:center;
  margin-bottom:50px;
}

.section-title h2{
  font-size:38px;
  color:var(--navy);
  margin-bottom:12px;
}

.section-title p{
  color:var(--muted);
  max-width:700px;
  margin:auto;
}

/* ================= SERVICES ================= */

.services{
  background:var(--light);
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 8px 25px rgba(7,26,51,.07);
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 35px rgba(7,26,51,.12);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-body{
  padding:24px;
}

.card h3{
  color:var(--navy);
  font-size:21px;
  margin-bottom:10px;
}

.card p{
  color:var(--muted);
}

/* ================= ABOUT ================= */

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.about-image img{
  width:100%;
  height:480px;
  object-fit:cover;
  border-radius:14px;
}

.about-text h2{
  color:var(--navy);
  font-size:40px;
  margin-bottom:20px;
}

.about-text p{
  color:var(--muted);
  margin-bottom:18px;
}

.points{
  list-style:none;
  margin:25px 0;
}

.points li{
  margin-bottom:12px;
  font-weight:600;
}

.points li::before{
  content:"✓";
  color:var(--gold);
  font-weight:900;
  margin-right:10px;
}

/* ================= PROJECTS ================= */

.projects{
  background:var(--light);
}

.project-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.project{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  height:300px;
}

.project img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.project:hover img{
  transform:scale(1.06);
}

.project-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:30px 20px 20px;
  color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
}

.project-overlay h3{
  font-size:20px;
}

/* ================= CONTACT ================= */

.contact{
  background:var(--navy);
  color:#fff;
}

.contact .section-title h2{
  color:#fff;
}

.contact .section-title p{
  color:#cbd5e1;
}

.contact-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.contact-box{
  padding:30px 20px;
  text-align:center;
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  background:rgba(255,255,255,.05);
}

.contact-box .icon{
  font-size:32px;
  margin-bottom:12px;
}

.contact-box h3{
  margin-bottom:8px;
  color:var(--gold);
}

.contact-box p,
.contact-box a{
  color:#e4eaf1;
}

/* ================= FOOTER ================= */

footer{
  background:#041221;
  color:#aeb8c5;
  padding:28px 0;
  text-align:center;
  font-size:14px;
}

footer strong{
  color:#fff;
}

/* ================= WHATSAPP ================= */

.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#25D366;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  z-index:999;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .navbar{
    min-height:64px;
  }

  .logo img{
    width:118px;
  }

  .menu-btn{
    display:block;
  }

  .nav-links{
    position:absolute;
    top:64px;
    left:0;
    width:100%;
    display:none;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    background:var(--navy);
    padding:10px 0 18px;
  }

  .nav-links.active{
    display:flex;
  }

  .nav-links li{
    width:100%;
  }

  .nav-links a{
    display:block;
    padding:13px 25px;
  }

  .language{
    padding:10px 25px;
  }

  .hero{
    min-height:600px;
    background-position:center center;
  }

  .hero h1{
    font-size:44px;
  }

  .hero p{
    font-size:17px;
  }

  .grid,
  .project-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .about-grid{
    grid-template-columns:1fr;
  }

  .contact-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  section{
    padding:65px 0;
  }

  .hero{
    min-height:560px;
  }

  .hero h1{
    font-size:38px;
    line-height:1.08;
  }

  .hero p{
    font-size:15px;
    line-height:1.6;
  }

  .buttons{
    flex-direction:column;
  }

  .btn{
    width:100%;
    min-height:48px;
  }

  .grid,
  .project-grid{
    grid-template-columns:1fr;
  }

  .section-title h2{
    font-size:31px;
  }

  .about-image img{
    height:330px;
  }

  .about-text h2{
    font-size:32px;
  }

  .whatsapp{
    width:54px;
    height:54px;
    right:15px;
    bottom:15px;
  }
}

/* ================= RTL ================= */

html[dir="rtl"] body{
  font-family:Arial,Tahoma,sans-serif;
}

html[dir="rtl"] .points li::before{
  margin-right:0;
  margin-left:10px;
}

</style>
</head>
