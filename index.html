 <script>
/* TARCI — FIX IMAGE PATHS */
(function () {
  document.querySelectorAll('img').forEach(function (img) {
    let src = img.getAttribute('src');

    if (src && src.includes('tarci-images/')) {
      img.src = src.replace('tarci-images/', '');
    }
  });

  document.querySelectorAll('[style]').forEach(function (el) {
    let style = el.getAttribute('style');

    if (style && style.includes('tarci-images/')) {
      el.setAttribute(
        'style',
        style.replace(/tarci-images\//g, '')
      );
    }
  });

  document.querySelectorAll('img').forEach(function (img) {
    img.addEventListener('error', function () {
      const src = img.getAttribute('src');

      if (src && src.includes('tarci-images/')) {
        img.src = src.replace('tarci-images/', '');
      }
    });
  });

  /* CSS backgrounds */
  try {
    document.querySelectorAll('style').forEach(function (styleTag) {
      styleTag.textContent = styleTag.textContent.replace(
        /tarci-images\//g,
        ''
      );
    });
  } catch (e) {}

})();
</script>
