*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:#222;
    background:#fff;
    line-height:1.6;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111;
    padding:18px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 3px 20px rgba(0,0,0,.25);
}

.logo{
    color:#d4a62a;
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:#d4a62a;
}

/* ================= HERO ================= */

.hero{
    min-height:680px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.60),rgba(0,0,0,.30)),
        linear-gradient(135deg,#171717,#4c4c4c);
    color:#fff;
}

.hero-content{
    width:86%;
    max-width:1200px;
    margin:auto;
    padding:80px 0;
}

.badge{
    display:inline-block;
    border:1px solid #d4a62a;
    color:#d4a62a;
    padding:8px 16px;
    border-radius:30px;
    font-weight:bold;
    margin-bottom:22px;
}

.hero h1{
    font-size:58px;
    line-height:1.1;
    max-width:950px;
    margin-bottom:22px;
}

.hero h1 span{
    color:#d4a62a;
}

.hero p{
    font-size:21px;
    max-width:760px;
    color:#eee;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:15px 27px;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn-gold{
    background:#d4a62a;
    color:#111;
}

.btn-gold:hover{
    background:#f0c54e;
    transform:translateY(-2px);
}

.btn-outline{
    border:1px solid #fff;
    color:#fff;
}

.btn-outline:hover{
    background:#fff;
    color:#111;
}

/* ================= STATS ================= */

.stats{
    background:#d4a62a;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    text-align:center;
    padding:25px 7%;
}

.stat strong{
    display:block;
    font-size:27px;
}

.stat span{
    font-size:14px;
    font-weight:bold;
}

/* ================= GENERAL ================= */

section{
    padding:85px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:50px;
}

.section-title small{
    color:#b18718;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:2px;
}

.section-title h2{
    font-size:40px;
    margin-top:8px;
}

.section-title p{
    max-width:700px;
    margin:15px auto 0;
    color:#666;
}

/* ================= SERVICES ================= */

.services{
    background:#f7f7f7;
}

.cards{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.card{
    background:#fff;
    padding:32px;
    border-radius:8px;
    border-bottom:4px solid transparent;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
    border-bottom-color:#d4a62a;
}

.icon{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    color:#d4a62a;
    border-radius:50%;
    font-size:25px;
    margin-bottom:20px;
}
