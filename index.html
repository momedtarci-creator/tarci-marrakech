/* =========================
   VARIABLES
========================= */

  --navy:#071a33;
  --navy2:#0d294b;
  --gold:#d6ad55;
  --white:#ffffff;
  --light:#f5f7fa;
  --text:#182433;
  --muted:#657384;

/* =========================

========================= */

*{

html{

}

body{

  color:var(--text);
  background:#fff;
  line-height:1.6;
}

img{
  max-width:100%;
  display:block;
}

a{
  text-decoration:none;
  color:inherit;
}

button{

}

.container{
  width:min(1180px,92%);

}

   HEADER
========================= */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  background:rgba(7,26,51,.96);
  backdrop-filter:blur(10px);
  box-shadow:0 2px 15px rgba(0,0,0,.15);
}

.navbar{
  min-height:72px;

}

}

}

.language button:hover{
  background:var(--gold);
  color:var(--navy);
}

.menu-btn{
  display:none;
  color:#fff;
  font-size:30px;
  cursor:pointer;
  user-select:none;
}

    center/cover no-repeat;
}

.hero-content{
  max-width:760px;
  color:#fff;
}

  margin-bottom:22px;
  font-weight:800;
}

.hero h1 span{

  padding:0 24px;

  transition:.25s;
}

.btn-primary{
  background:var(--gold);

}

  transform:translateY(-2px);
  background:#e5bf6d;
}

.btn-outline{

  color:#fff;
}

}

.section-title p{

  margin:auto;
}

========================= */

.services{

}

  display:grid;
  grid-template-columns:repeat(3,1fr);

}

  background:#fff;

  box-shadow:0 8px 25px rgba(7,26,51,.07);

}

  transform:translateY(-5px);

}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

  padding:24px;
}

.card h3{

}

.card p{
  color:var(--muted);
}

}

  font-size:40px;
  margin-bottom:20px;
}

.about-text p{

  margin-bottom:18px;
}

}
